include:
  - project: 'github-mirror/ci-templates'
    file: '/.gitlab-ci-template.yml'

variables:
  COMPONENT_NAME: "autotests"
  IMAGE_NAME: "library/autotests"
  DOCKERFILE_PATH: "Dockerfile"
  ENV_SUFFIX: ""
  ENV_FILE_DEST: ""
  ENV_FILE_BUILD_ARG: ""
  AUTOTESTS_TEST_SUITE:
    value: "all_api_tests"
    description: "TEST_SUITE для nightly CronJob."
  CONFIGS_REPO_VALUES_DIR: "helm/autotests-nightly"
  GITOPS_VALUES_ROOT: "autotests"
  GITOPS_IMAGE_VALUE_MODE: "scalar"
  GITOPS_RESOURCE_KIND: "cronjob"
  GITOPS_RESOURCE_NAME: "autotests-nightly"
  GITOPS_CONTAINER_NAME: "autotests"
  GITOPS_DEV_ARGOCD_APP: "autotests-nightly"
deploy:
  rules:
    - when: never

deploy-autotests:
  extends: .gitops-dev-stage-deploy-template
  rules:
    - if: '$BUILD_ONLY == "true" || $ROLLBACK_PROD == "true"'
      when: never
    - if: '$DEPLOY_PROD == "false"'
      when: on_success
    - when: never

run-autotests-now:
  stage: deploy
  image:
    name: alpine/k8s:1.33.5
    entrypoint: [""]
  needs:
    - job: deploy-autotests
      optional: true
  rules:
    - if: '$DEPLOY_PROD == "false"'
      when: manual
    - when: never
  allow_failure: true
  script:
    - |
      set -eu
      JOB_NAME="autotests-manual-${CI_PIPELINE_ID}"
      kubectl create job "$JOB_NAME" --from=cronjob/autotests-nightly -n "$ENVIRONMENT"
      # Leave time for cleanup before the runner's one-hour job timeout.
      DEADLINE=$(( $(date +%s) + 3300 ))
      NEXT_PROGRESS=0
      while :; do
        CONDITIONS=$(kubectl get job "$JOB_NAME" -n "$ENVIRONMENT" --request-timeout=20s \
          -o jsonpath='{range .status.conditions[?(@.status=="True")]}{.type}{" "}{end}')
        case " $CONDITIONS " in
          *" Failed "*)
            echo "ERROR: $ENVIRONMENT/$JOB_NAME failed; tests or report delivery returned an error."
            kubectl get pods -n "$ENVIRONMENT" -l "job-name=$JOB_NAME" \
              --request-timeout=20s \
              -o 'custom-columns=NAME:.metadata.name,PHASE:.status.phase,EXIT_CODE:.status.containerStatuses[*].state.terminated.exitCode' || true
            exit 1
            ;;
          *" Complete "*)
            echo "Autotests completed successfully: $ENVIRONMENT/$JOB_NAME"
            exit 0
            ;;
        esac
        NOW=$(date +%s)
        if [ "$NOW" -ge "$DEADLINE" ]; then
          echo "ERROR: timed out waiting for $ENVIRONMENT/$JOB_NAME; the Kubernetes Job was not deleted."
          exit 1
        fi
        if [ "$NOW" -ge "$NEXT_PROGRESS" ]; then
          echo "Waiting for autotests: $ENVIRONMENT/$JOB_NAME (Complete or Failed)"
          NEXT_PROGRESS=$(( NOW + 30 ))
        fi
        sleep 5
      done

backup-prod:
  rules:
    - when: never

deploy-prod:
  rules:
    - when: never
