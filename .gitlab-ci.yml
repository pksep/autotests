include:
  - project: 'github-mirror/ci-templates'
    file: '/.gitlab-ci-template.yml'

variables:
  COMPONENT_NAME: "autotests"
  IMAGE_NAME: "library/autotests"
  DOCKERFILE_PATH: "Dockerfile"
  ENV_SUFFIX: ""
  ENV_FILE_DEST: ""
  ENV_FILE_BUILD_ARG: ""
  AUTOTESTS_TEST_SUITE:
    value: "all_api_tests"
    description: "TEST_SUITE для nightly CronJob."
  CONFIGS_REPO_VALUES_DIR: "helm/autotests-nightly"
  GITOPS_VALUES_ROOT: "autotests"
  GITOPS_IMAGE_VALUE_MODE: "scalar"
  GITOPS_RESOURCE_KIND: "cronjob"
  GITOPS_RESOURCE_NAME: "autotests-nightly"
  GITOPS_CONTAINER_NAME: "autotests"
  GITOPS_DEV_ARGOCD_APP: "autotests-nightly"
deploy:
  rules:
    - when: never

deploy-autotests:
  extends: .gitops-dev-stage-deploy-template
  rules:
    - if: '$BUILD_ONLY == "true" || $ROLLBACK_PROD == "true"'
      when: never
    - if: '$DEPLOY_PROD == "false"'
      when: on_success
    - when: never

run-autotests-now:
  stage: deploy
  image:
    name: alpine/k8s:1.33.5
    entrypoint: [""]
  needs:
    - job: deploy-autotests
      optional: true
  rules:
    - if: '$DEPLOY_PROD == "false"'
      when: manual
    - when: never
  allow_failure: true
  script:
    - |
      set -e
      JOB_NAME="autotests-manual-${CI_PIPELINE_ID}"
      kubectl create job "$JOB_NAME" --from=cronjob/autotests-nightly -n "$ENVIRONMENT"
      kubectl wait --for=condition=complete --timeout=2h job/"$JOB_NAME" -n "$ENVIRONMENT"

backup-prod:
  rules:
    - when: never

deploy-prod:
  rules:
    - when: never
